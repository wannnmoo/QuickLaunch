<?xml version="1.0" encoding="UTF-8"?>
<!--
  QuickLaunch 主图标（应用 / 安装包 / 桌面 / 开始菜单 / 窗口 / 任务栏）
  =====================================================================
  设计语言：**蓝色圆角方块 + 三块白色瓷砖**。
  蓝色方块 = Dock 的玻璃条，三块瓷砖 = 停在上面的一格格快捷方式。
  托盘图标用的是同一个蓝色方块（只把内部符号换成加号），两枚图标一眼是一套。

  ── 尺寸不是「好看的数字」，是**从像素网格反推**出来的 ──────────────────
  图标最小要出到 16×16，那时整个画布只有 16 格，能承载的结构极其有限。
  用实际渲染 + 逐像素分析（.dsh-vision-toolkit/final-check.mjs）量过几轮，结论：

    条宽 48 / 间隙 32（256 坐标系）  →  16px 下 = 条 4px、隙 2px
    16px 实际渲染的一行：B WWWW B WWWW B WWWW B    ← 两条间隙完整保留

  走过的弯路（都有实测数据，别再回头）：
    · 2×2 四宫格     16px 下白色连成一片，四条间隙全部消失 → 读成一个白方块
    · 三条**横**线   16px 下虽然分得开，但满宽横线 + 0.24 长宽比 = 标准「汉堡菜单」
                     图标，语义完全跑偏（我们要表达的是 Dock，不是菜单）
    · 竖块但间隙 12  16px 下隙只有 0.75px，抗锯齿直接糊平 → 又是一个白方块
                     （当时误把「抗锯齿产生的浅蓝像素」数成了结构，教训：
                       判断小尺寸可读性必须看**间隙里是否真的还有底色**，
                       而不是数浅色连通块个数）

  ── 绘制约束（重要）──────────────────────────────────────────────────
  只允许 <rect> / <g fill>，不要引入 path / stroke / 渐变 / 滤镜。
  图标生成器 .dsh-vision-toolkit/make-icons.mjs 是按「圆角矩形的**解析**覆盖率」光栅化的：
  每个尺寸独立求覆盖率，不做超采样、也不从 256 缩下来，所以 16px 的边缘同样锐利。
  代价是它只认圆角矩形——要画更复杂的形状得先换渲染方案。

  另一个坑：生成器解析前会先剥掉 XML 注释。注释里若出现 `<g fill=...>` 这样的标签文本，
  不剥注释就会被正则先匹配到（这个坑已经踩过一次）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 背景：蓝色圆角方块（圆角 54/256 ≈ 21%，接近 Windows 11 图标比例） -->
  <g fill="#3B7BD5">
    <rect x="0" y="0" width="256" height="256" rx="54"/>
  </g>

  <!-- 三块白色瓷砖：条宽 48、间隙 32、高 140、上下留白 58（全部居中）。
       48/32 是 16px 网格反推的结果：4px 条 + 2px 隙，间隙在小尺寸下不会被糊掉。 -->
  <g fill="#FFFFFF">
    <rect x="24"  y="58" width="48" height="140" rx="12"/>
    <rect x="104" y="58" width="48" height="140" rx="12"/>
    <rect x="184" y="58" width="48" height="140" rx="12"/>
  </g>
</svg>
