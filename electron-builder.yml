appId: com.quicklaunch.app
productName: QuickLaunch
# 直接复用 node_modules/electron/dist（npm install 时已经解包好的运行时），
# 不再在仓库根目录放一份 137 MB 的 electron-v*.zip。
#   ① 那份 zip 从来没有被 git 跟踪（.gitignore 的 electron-v*.zip），
#      所以它只是「本地磁盘上的临时物料」，删掉不影响任何克隆；
#   ② electronDist 接受 zip 或**已解包目录**，指到 node_modules 就省了复制一份；
#   ③ 新环境只要 `npm install` 过，这个目录必然存在，无需额外下载。
# ⚠️ 不要改回 ./electron-v*.zip：文件不在仓库里，package 会直接报找不到。
electronDist: ./node_modules/electron/dist
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron-vite.config.*'
  - '!{.eslintignore,.eslintrc,.prettierignore,.prettierrc,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 不打包 node_modules：三个产物**都不在运行时 require 任何第三方包**——main 只依赖
  # electron + node 内置模块（child_process/fs/path），preload 只依赖 electron，
  # renderer 由 Vite 把 react/react-dom 全量打进 bundle。
  # 实测 asar 里的 node_modules（react/react-dom/scheduler）共 7.2 MB，纯属白占体积。
  # 注意：本项目**没有运行时依赖**，所以整目录排除是安全的；一旦将来真要用外部/原生模块
  # （例如加个 sqlite），必须去掉这一行，否则那个包不会被打进产物。
  - '!node_modules/**'
  # 不打包开发脚手架与本地 Electron 分发包（v1.13.1 补）：
  # electron-builder 的 files 是**排除式**——没列出来的东西都会进 asar。实测漏掉了两类：
  #   ① `electron-v*.zip`（144 MB，仅用于 electronDist 跳过下载）——它本身就躺在项目根目录，
  #      于是被整包塞进 asar，把 app.asar 撑到 142 MB；
  #   ② `devtools/**`（3.7 MB / 224 个文件：图标候选图、探针脚本、截图、提交信息草稿）
  #      ——asar 250 个条目里有 235 个是它。
  # 两者都不参与运行时（main 只读 `out/**` 与 `resources/`），必须显式排除。
  - '!electron-v*.zip'
  - '!devtools/**'
  # 运行时不需要的仓库文档/增量编译缓存：asar 里曾多出约 230 KB
  - '!CLAUDE.md'
  - '!CHANGELOG.md'
  - '!**/*.tsbuildinfo'
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  # 托盘图标用多尺寸 ICO（16/20/24/32），由外壳按当前显示器缩放挑原生尺寸
  - from: resources/tray-icon.ico
    to: tray-icon.ico
win:
  executableName: QuickLaunch
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
# 产物名必须与 latest.yml 里记录的 url 一致，否则自动更新会 404：
# 默认命名带空格（QuickLaunch Setup 1.17.0.exe），而 latest.yml 里写的是连字符版本。
artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  # 向导式安装（非一键）：安装时出现「选择安装位置」页面，可改路径。
  # 注意：electron-builder 的 NSIS 配置是顶层键，不是 win.nsis
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 按用户安装，默认目录 %LOCALAPPDATA%\Programs\QuickLaunch，无需管理员权限；
  # 向导中用户可自行改为任意路径（如 D:\...）
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 快捷方式面板
  # 安装向导语言：中英文都打进安装包，按系统语言自动选择
  installerLanguages:
    - zh_CN
    - en_US
mac:
  entitlementsInherit: entitlements.mac.plist
  icon: resources/icon.ico
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: resources/icon.ico
